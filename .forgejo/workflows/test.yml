name: "Test"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: "Test ${{ matrix.go }}"
    runs-on: codeberg-tiny-lazy
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        go: [stable, oldstable]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: '${{ matrix.go }}'
      - name: Test
        run: make test
      - name: golangci-lint
        uses: https://github.com/golangci/golangci-lint-action@v8
        with:
          version: v2.5